name: raw360_formats
description: >-
  Readers for the raw files of 360° cameras (Insta360, GoPro MAX, DJI Osmo 360) and for spherical and stereo
  metadata (GPano, Spherical Video V1 and V2, VR180, Apple spatial), with the lens models to stitch them. Pure Dart.
version: 0.1.0
repository: https://github.com/freeKC/raw360-formats
issue_tracker: https://github.com/freeKC/raw360-formats/issues
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  collection: ^1.19.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
